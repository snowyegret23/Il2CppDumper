name: Release commit

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up x86 .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-architectures
        with:
          architecture: x86
          dotnet-version: 8.0.x

      - name: Set up x64 .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          architecture: x64
          dotnet-version: 8.0.x

      - name: Build, smoke-test and package
        env:
          RELEASE_DIR: ${{ runner.temp }}/il2cpp-release
          DOTNET_ROOT_X86: ${{ runner.temp }}/dotnet-architectures/x86
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_SHA.Substring(0, 12)
          New-Item -Path $env:RELEASE_DIR -ItemType Directory -Force | Out-Null
          $packages = @(
            @{ Framework = 'net8.0'; Mode = 'framework-dependent'; SelfContained = 'false' }
            @{ Framework = 'net8.0'; Mode = 'self-contained'; SelfContained = 'true' }
          )
          foreach ($rid in @('win-x64', 'win-x86')) {
            foreach ($package in $packages) {
              $name = "$($package.Framework)-$rid-$($package.Mode)"
              $publishDir = Join-Path $env:RELEASE_DIR $name
              dotnet publish Il2CppDumper/Il2CppDumper.csproj -c Release -f $package.Framework -r $rid --self-contained $package.SelfContained -o $publishDir -p:ContinuousIntegrationBuild=true
              if ($LASTEXITCODE -ne 0) { throw "Publish failed for $name" }
              & (Join-Path $publishDir 'Il2CppDumper.exe') --help
              if ($LASTEXITCODE -ne 0) { throw "Smoke test failed for $name" }
              if ($package.SelfContained -eq 'true' -and -not (Test-Path -LiteralPath (Join-Path $publishDir 'coreclr.dll'))) {
                throw "The self-contained package is missing the .NET runtime: $name"
              }
              Copy-Item -Path README.md, README.zh-CN.md, LICENSE -Destination $publishDir
              Copy-Item -Path Il2CppDumper/*.py -Destination $publishDir
              Copy-Item -LiteralPath Il2CppDumper/Il2CppBinaryNinja -Destination $publishDir -Recurse
              $archive = Join-Path $env:RELEASE_DIR "Il2CppDumper-$tag-$name.zip"
              Compress-Archive -Path "$publishDir/*" -DestinationPath $archive -CompressionLevel Optimal
            }
          }

      - name: Publish the commit release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/il2cpp-release
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_SHA.Substring(0, 12)
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          function Get-OptionalGitHubResource($path) {
            try {
              Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/$path" -Headers $headers
            } catch {
              if ($null -eq $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
              return $null
            }
          }

          $tagRef = Get-OptionalGitHubResource "git/ref/tags/$tag"
          if ($null -ne $tagRef -and ($tagRef.object.type -ne 'commit' -or $tagRef.object.sha -ne $env:GITHUB_SHA)) {
            throw "Tag $tag already exists and does not point directly to $env:GITHUB_SHA"
          }
          $release = Get-OptionalGitHubResource "releases/tags/$tag"
          if ($null -ne $release) {
            if (-not $release.draft) {
              if ($null -eq $tagRef) { throw "Published release $tag has no matching tag" }
              Write-Output "Release $tag is already published; leaving it unchanged."
              return
            }
            if ($null -eq $tagRef -and $release.target_commitish -ne $env:GITHUB_SHA) {
              throw "Draft release $tag targets a different commit"
            }
          }

          $assets = foreach ($rid in @('win-x64', 'win-x86')) {
            foreach ($name in @("net8.0-$rid-framework-dependent", "net8.0-$rid-self-contained")) {
              $asset = Join-Path $env:RELEASE_DIR "Il2CppDumper-$tag-$name.zip"
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
              $asset
            }
          }
          if ($null -eq $release) {
            $notes = "Automated build of commit $env:GITHUB_SHA.`n`nRecommended: net8.0-win-x64-self-contained.zip or net8.0-win-x86-self-contained.zip includes the .NET runtime; extract the ZIP and run Il2CppDumper.exe without installing .NET. For Windows PE inputs, choose x86 for 32-bit binaries and x64 for 64-bit binaries. Keep the two packages in separate directories.`n`nThe smaller framework-dependent packages require the matching architecture of the .NET 8 runtime."
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Il2CppDumper $tag" --notes $notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }
          }
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; the release remains a draft' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release' }
